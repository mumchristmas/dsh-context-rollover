# Bundle patch: mount the rollover interceptor.
#
# The plugin adds a prepended `agent/pre-step` listener, its model-facing
# tools, and `/rollover now` to *every* session of *every* preset, from the
# host plane. It never disables, replaces, or retunes the session's compaction
# backend: `ctx.compaction` keeps its owner and its threshold, and the plugin
# wins simply by having the earlier pressure point (its default 0.75 against
# the stock backend's 0.8). Removing this bundle therefore removes a listener
# and four tools — no session and no preset depends on it.
- insert:
    - id: context-rollover
      name: dsh-context-rollover
      config: {}
